name: Generar APK v8

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar SDK Android
        shell: bash
        run: |
          task_sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$task_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$task_sdk_root" \
            'platforms;android-35' \
            'build-tools;35.0.0'
          echo "sdk.dir=$task_sdk_root" > local.properties

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Calendario-Colombia-v8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
